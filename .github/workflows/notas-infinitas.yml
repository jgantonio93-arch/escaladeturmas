name: Notas Infinitas (APK Android)

on:
  push:
    paths:
      - "notas-infinitas/**"
      - ".github/workflows/notas-infinitas.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notas-infinitas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: notas-infinitas-apk
          path: notas-infinitas/app/build/outputs/apk/debug/*.apk
