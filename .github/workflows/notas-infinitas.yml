name: Notas Infinitas (APK Android)

on:
  push:
    paths:
      - "notas-infinitas/**"
      - ".github/workflows/notas-infinitas.yml"
      - "!notas-infinitas/docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notas-infinitas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: notas-infinitas-apk
          path: notas-infinitas/app/build/outputs/apk/debug/*.apk

      - name: Testes de funcionamento
        run: ./gradlew testDebugUnitTest --tests "*FunctionalTest*"

      - name: Gerar capturas de tela
        if: always()
        run: ./gradlew testDebugUnitTest --tests "*ScreenshotTest*" --stacktrace

      - name: Salvar capturas no branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Capturas sem mudanças."
          else
            git commit -m "Atualiza capturas de tela [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Branch mudou durante o build; capturas ficam para a próxima execução."
          fi
